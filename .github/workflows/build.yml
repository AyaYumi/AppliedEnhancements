name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ae2
            args: ''
          - name: uelm
            args: '-Pae2_uelm_version=15.5.4-uelm'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate repository files and public documentation
        run: python .github/scripts/check_repository.py

      - name: Build and test
        run: bash gradlew ${{ matrix.args }} build apiJavadoc --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: appliedenhancements-1.1.0-forge-${{ matrix.name }}
          path: |
            build/libs/*.jar
            build/docs/api/
            build/reports/tests/test/
