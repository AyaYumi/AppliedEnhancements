name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ae2
            args: ''
          - name: uelm
            args: '-Pae2_uelm_version=15.5.4-uelm'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate resources and docs
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path.cwd()
          for source in (root / 'src/main/resources').rglob('*.json'):
              json.loads(source.read_text(encoding='utf-8'))
          docs = list((root / 'docs').glob('*.md')) + [root / 'README.md', root / 'README_ZH.md']
          for source in docs:
              for target in re.findall(r'\]\(([^)]+)\)', source.read_text(encoding='utf-8')):
                  target = target.strip('<>').split('#', 1)[0]
                  if target and not re.match(r'[a-zA-Z][a-zA-Z0-9+.-]*:', target) and not (source.parent / target).exists():
                      raise SystemExit(f'{source}: missing {target}')
      - name: Build and test
        run: bash gradlew ${{ matrix.args }} build apiJavadoc --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: appliedenhancements-1.1.0-forge-${{ matrix.name }}
          path: |
            build/libs/*.jar
            build/docs/api/
            build/reports/tests/test/
