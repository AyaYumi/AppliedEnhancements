name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ae2: ['19.2.17', '19.2.18']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate repository files and public documentation
        run: python .github/scripts/check_repository.py

      - name: Build and public API documentation
        run: bash gradlew -Pae2_version=${{ matrix.ae2 }} build apiJavadoc --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: appliedenhancements-1.1.1-ae2-${{ matrix.ae2 }}
          path: |
            build/libs/*.jar
            build/docs/api/
            build/reports/tests/test/
