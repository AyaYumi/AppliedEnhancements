modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/AyaYumi/AppliedEnhancements/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/AyaYumi/AppliedEnhancements"
authors="${mod_authors}"
description='''${mod_description}

Applied Enhancements - 通用 AE2 系统增强模组。
提供超大数量合成、样板缓存、无限容量显示，以及面向 AE2 与其附属模组的兼容性修复。'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    mandatory=true
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="expatternprovider"
    mandatory=false
    versionRange="${extendedae_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2wtlib"
    mandatory=false
    versionRange="${ae2wtlib_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
